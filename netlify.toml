# Netlify config — ContractorLogic

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/privacy-policy/"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
